version: "3.9"

services:
  nsfw-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nsfw-telegram-bot
    restart: unless-stopped
    environment:
      - TF_CPP_MIN_LOG_LEVEL=2
      - PYTHONUNBUFFERED=1
    volumes:
      - ./bot/model:/app/model:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
